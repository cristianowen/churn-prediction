name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Unit tests
        run: pytest -q
      - name: Training smoke test (real data, few trials)
        run: python -m churn.train --fast
      - name: Build API image
        if: matrix.python-version == '3.12'
        run: docker build -t churn-api .
