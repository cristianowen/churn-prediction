[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "1.0.0"
description = "Customer churn prediction with profit-optimal retention targeting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "optuna>=3.6",
    "shap>=0.45",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
